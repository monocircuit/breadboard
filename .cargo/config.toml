# What cargo runs (the unit tests) inherits the live env: a herdr call in a
# test reached the user's herdr (#423). Its socket here is none, and no test
# believes it runs in herdr.
[env]
HERDR_ENV = { value = "0", force = true }
HERDR_SOCKET_PATH = { value = "/nonexistent/breadboard-test/herdr.sock", force = true }
