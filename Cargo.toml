# breadboard in Rust (#314): one binary, `breadboard`, built from the crates
# below. The Node code in src/ stays until each part is cut over
# (docs/rewrite-plan.md).
[workspace]
resolver = "3"
members = ["crates/core", "crates/breadboard"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/monocircuit/breadboard"

[workspace.dependencies]
breadboard-core = { path = "crates/core" }
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
libc = "0.2"
ratatui = "0.30"
regex = "1"
regex-syntax = "0.8"
toml = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "fs", "signal"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
